<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mark Dave’s Bantay Barangay</title>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
</style>
<style>
:root{
  --bg:#E4ECE6;--panel:#FFFFFF;--panel2:#EEF3EF;--ink:#1D2A2E;--muted:#56676C;--line:#C9D6CE;
  --gold:#A8730A;--goldbg:#FFF1CF;--ore:#5A6C8C;--accent:#2F6F5E;--accentInk:#FFFFFF;--danger:#B93C36;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121B1F;--panel:#1C292F;--panel2:#24353C;--ink:#E9F1EC;--muted:#9AAEB2;--line:#33474F;
    --gold:#F2B93D;--goldbg:#3A2F15;--ore:#9FB3D6;--accent:#62B89E;--accentInk:#0E1A16;--danger:#EE6A62;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121B1F;--panel:#1C292F;--panel2:#24353C;--ink:#E9F1EC;--muted:#9AAEB2;--line:#33474F;
  --gold:#F2B93D;--goldbg:#3A2F15;--ore:#9FB3D6;--accent:#62B89E;--accentInk:#0E1A16;--danger:#EE6A62;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:560px;margin:0 auto;padding:10px 12px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.by{font-size:12px;font-weight:800;color:var(--muted);margin-top:3px}
h1{font:400 26px/1 "Lilita One","Arial Rounded MT Bold",Nunito,sans-serif;margin:0;letter-spacing:.3px}
.wallet{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.pill.gold{color:var(--gold);background:var(--goldbg);border-color:transparent}
.pill.ore{color:var(--ore)}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#183029}
#gl{width:100%;height:310px;touch-action:none;cursor:grab}
#gl canvas{display:block;width:100%!important;height:100%!important}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stagebar{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.where{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.where b{font:400 20px/1 "Lilita One",Nunito,sans-serif;display:block}
.where span{font-size:12px;opacity:.85}
.ctrls{display:flex;gap:6px;pointer-events:auto}
.chip{border:0;border-radius:999px;padding:6px 11px;font:800 13px Nunito,sans-serif;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;backdrop-filter:blur(4px)}
.chip.go{background:#F2B93D;color:#2a1d00}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#F2B93D}
.tabs{display:flex;gap:4px;margin:12px 0 10px;background:var(--panel2);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:800 14px Nunito,sans-serif;padding:9px 4px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.panel{display:none}
.panel.on{display:block}
.hero{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;cursor:pointer}
.hero.sel{border-color:var(--accent)}
.badge{width:44px;height:44px;border-radius:14px;background:var(--c);display:grid;place-items:center;font:400 22px "Lilita One",sans-serif;color:#fff}
.hname{font-weight:800}
.hname small{color:var(--muted);font-weight:700;margin-left:4px}
.hstats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.slots{display:flex;gap:5px;margin-top:6px}
.slot{width:34px;height:34px;border-radius:10px;border:2px dashed var(--line);background:var(--panel2);display:grid;place-items:center;font-size:16px;cursor:pointer;padding:0}
.slot.full{border-style:solid;border-color:var(--rc)}
.btn{border:0;border-radius:12px;padding:9px 12px;font:800 14px Nunito,sans-serif;background:var(--accent);color:var(--accentInk);cursor:pointer;white-space:nowrap}
.btn small{display:block;font-weight:700;font-size:12px;opacity:.85}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tog{border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;font:800 11px Nunito,sans-serif;padding:2px 8px;margin-left:8px;cursor:pointer;vertical-align:2px}
.tog.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.lineup{font-size:13px;color:var(--muted);margin:0 0 8px}
.hdesc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.acts{display:flex;flex-direction:column;gap:6px}
.btn.evo{background:#F2B93D;color:#2A1D00}
.evonext{font-size:12px;font-weight:800;color:var(--gold);margin-top:3px}
.star{color:var(--gold);margin-left:4px;font-size:13px}
.quest{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.quest.done{opacity:.55}
.qic{font-size:22px;text-align:center}
.qbody b{font-size:14px}
.qbar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:5px 0 3px}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qok{color:var(--accent);font-weight:800;font-size:20px;padding:0 10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);vertical-align:2px}
.dot[hidden]{display:none}
.comborow{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:46px}
#comboName{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.cbar{flex:1;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F2B93D,#FF7A3C);transition:width .25s}
#comboBtn{padding:6px 12px}
.combocard{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
.combocard.on{border-style:solid;border-color:#F2B93D;background:var(--goldbg)}
.cic{font-size:20px;white-space:nowrap}
.tag{font-size:11px;font-weight:800;margin-left:8px;color:var(--muted)}
.combocard.on .tag{color:var(--gold)}
.form h2{margin-bottom:2px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fh{font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.cell{min-height:66px;border:2px dashed var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);font:700 12px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;cursor:pointer}
.cell.full{border-style:solid;background:var(--panel)}
.cell.pick{border-color:var(--accent);outline:3px solid var(--accent);outline-offset:1px}
.cic2{font-size:20px;line-height:1.1}
.cn{font-weight:800;font-size:11px;line-height:1.15;text-align:center}
.cell small{color:var(--muted);font-size:10px}
.plus{font-size:20px;color:var(--muted)}
.recruit{display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:2px dashed var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
.recruit p{margin:0;font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h2{font:400 19px "Lilita One",Nunito,sans-serif;margin:0 0 4px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.odds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.odds span{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;border:1.5px solid var(--rc);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.baghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.baghead p{margin:0;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:var(--panel);border:2px solid var(--rc);border-radius:14px;padding:9px}
.item b{display:block;font-size:14px}
.item .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .delta{font-size:12px;font-weight:800}
.up{color:#2E9B5F}.down{color:var(--danger)}
.item .row{margin-top:8px}
.item .btn{padding:6px 9px;font-size:13px;flex:1}
.empty{color:var(--muted);text-align:center;padding:24px 10px;border:2px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;padding:20px;z-index:6}
.modal.show{display:grid}
.modal .card{max-width:340px;text-align:center}
footer{margin-top:16px;text-align:center}
.credit{font-size:12px;color:var(--muted);margin:0 0 6px}
footer button{background:none;border:0;color:var(--muted);font:700 13px Nunito,sans-serif;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Bantay Barangay</h1><div class="by">A game by Mark Dave</div></div>
    <div class="wallet">
      <span class="pill gold" title="Piso">₱ <span id="gold">0</span></span>
      <span class="pill ore" title="Bote">🍾 <span id="ore">0</span></span>
    </div>
  </header>

  <div class="stage">
    <div id="gl" role="img" aria-label="3D battlefield. Drag to rotate, pinch or scroll to zoom."></div><canvas id="ov" aria-hidden="true"></canvas>
    <div class="stagebar">
      <div class="where"><b id="stageLbl">Stage 1</b><span id="zoneLbl">Kanto ng Barangay</span><div class="dots" id="dots"></div></div>
      <div class="ctrls">
        <button class="chip go" id="challenge" hidden>Challenge boss</button>
        <button class="chip" id="cam" aria-label="Reset camera" title="Reset camera">🎥</button>
        <button class="chip" id="speed">1×</button>
      </div>
    </div>
  </div>

  <div class="comborow"><span id="comboName">⚡</span><div class="cbar"><i id="cfill"></i></div><button class="btn evo" id="comboBtn" hidden>Combo!</button></div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="team">Tropa</button>
    <button role="tab" aria-selected="false" data-tab="forge">Ukay-ukay</button>
    <button role="tab" aria-selected="false" data-tab="bag">Bayong <span id="bagCount"></span></button>
    <button role="tab" aria-selected="false" data-tab="quest">Gawain <span class="dot" id="qdot" hidden></span></button>
  </div>

  <section class="panel on" id="p-team"></section>
  <section class="panel" id="p-forge"></section>
  <section class="panel" id="p-bag"></section>
  <section class="panel" id="p-quest"></section>

  <footer><p class="credit">Bantay Barangay is an original game created by Mark Dave.<br>© 2026 Mark Dave. All rights reserved.</p><button id="reset">Start over</button></footer>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><h2 id="mTitle"></h2><p id="mText"></p><button class="btn" id="mOk">Collect</button></div></div>

<script src="lib/three.min.js"></script>
<script>
/* ---------- data ---------- */
const CLS={
  knight:{name:'Tanod',ic:'🦺',hp:130,atk:7,cd:1.0,color:'#E0702A',cost:0,row:0,desc:'Barangay tanod with a yantok. Takes the hits up front'},
  archer:{name:'Batang Tirador',ic:'🎯',hp:75,atk:10,cd:0.85,color:'#2F8F6B',cost:60,row:1,desc:'Kid from the kanto with a deadly slingshot'},
  tindera:{name:'Aling Tindera',ic:'🏪',hp:70,atk:6,cd:1.1,color:'#D9822B',cost:150,row:1,sp:'gold',desc:'Throws candy from her sari-sari store. +30% piso from every kill'},
  mage:{name:'Albularyo',ic:'🌿',hp:60,atk:8,cd:1.7,color:'#7A8F2A',cost:250,row:2,aoe:true,desc:'Burns herbs. The smoke hits every enemy'},
  cleric:{name:'Lola Hilot',ic:'👵',hp:85,atk:4,cd:1.4,color:'#C9497F',cost:700,row:2,heal:true,desc:'Heals the most hurt ally with her hilot oil'},
  tsuper:{name:'Manong Tsuper',ic:'🚌',hp:110,atk:14,cd:2.2,color:'#C83A3A',cost:1500,row:0,sp:'stun',desc:'Rams the front enemy with his jeepney and stuns it'},
  tambay:{name:'Kuya Tambay',ic:'🩳',hp:170,atk:5,cd:1.2,color:'#5B6B7A',cost:3000,row:0,sp:'regen',desc:'Never leaves the kanto. Shrugs off hits and slowly heals himself'},
  marites:{name:'Aling Marites',ic:'📱',hp:65,atk:5,cd:4.5,color:'#B04FA0',cost:6000,row:2,sp:'mark',desc:'Spreads chismis about every enemy. They take +30% damage'},
  tito:{name:'Tito Videoke',ic:'🎤',hp:80,atk:6,cd:5,color:'#2C7FB8',cost:12000,row:2,sp:'haste',desc:'Belts a power ballad. The whole tropa attacks 40% faster'},
  balut:{name:'Mang Balut',ic:'🥚',hp:70,atk:12,cd:1.3,color:'#8A6A3A',cost:25000,row:1,sp:'crit',desc:'“Baluuut!” His thrown eggs crit often for huge damage'},
  kapitan:{name:'Kapitan',ic:'🏛️',hp:120,atk:9,cd:1.2,color:'#C9A86A',cost:60000,row:1,sp:'aura',desc:'Barangay captain. Every fighter in the lineup gets +15% atk and hp'}
};
const EVO={knight:['Chief Tanod','Kagawad'],archer:['Kuyang Tirador','Alamat ng Tirador'],tindera:['Sari-sari Queen','Tycoon ng Divisoria'],
  mage:['Babaylan','Punong Babaylan'],cleric:['Hilot Master','Lola ng Bayan'],tsuper:['Boss ng Terminal','Hari ng Kalsada'],tambay:['Tambay ng Taon','Hari ng Kanto'],
  marites:['Marites Supreme','Reyna ng Chismis'],tito:['Tito Birit','Tito Perfect 100'],balut:['Balut Master','Hari ng Penoy'],kapitan:['Mayor','Gobernador']};
const EVO_LV=[15,40],EVO_M=[1,1.5,2.25];
const nameOf=h=>h.ev?EVO[h.cls][h.ev-1]:CLS[h.cls].name;
const ORDER=Object.keys(CLS).sort((a,b)=>CLS[a].cost-CLS[b].cost);
const RAR=[{n:'Divisoria',c:'#8A9196',m:1},{n:'Pang-mall',c:'#3C9A58',m:2.2},{n:'Imported',c:'#3B7DD8',m:4.8},{n:'Balikbayan box',c:'#9B4FD1',m:10}];
const SLOTS=['weapon','armor','charm'];
const SLOTN={weapon:'Sandata',armor:'Damit',charm:'Agimat'};
const SLOTI={weapon:'🩴',armor:'👕',charm:'🧄'};
const NAMES={weapon:['Tsinelas','Walis tingting','Payong','Sandok','Yantok','Arnis stick'],
  armor:['Sando','Daster','Kamisa de chino','Barong','Jacket pang-ulan','Jersey ng liga'],
  charm:['Kwintas na bawang','Anting-anting','Agimat','Asin sa bulsa','Tawas','Lucky keychain']};
const itemName=it=>NAMES[it.slot][it.id%6];
const ZONES=[
  {n:'Kanto ng Barangay',sky:['#22344A','#121C28'],gr:'#4B4F55',e:'duwende',boss:'Hari ng Duwende',ab:'summon',abTxt:'calls duwende helpers to shield him'},
  {n:'Balete Drive',sky:['#1F3A2E','#0C1812'],gr:'#2E3A2A',e:'whitelady',boss:'White Lady ng Balete',ab:'vanish',abTxt:'vanishes and can’t be hit for a moment',moon:1},
  {n:'Bukid sa Probinsya',sky:['#5A3A4A','#24152A'],gr:'#4A5A2A',e:'tikbalang',boss:'Tikbalang King',ab:'charge',abTxt:'charges past the front line to hit your back row'},
  {n:'Lumang Mansyon',sky:['#3A2230','#160B12'],gr:'#3A2A26',e:'aswang',boss:'Aswang Elder',ab:'leech',abTxt:'heals itself with every bite'},
  {n:'Tulay sa Hatinggabi',sky:['#1E2140','#0B0C1E'],gr:'#2A2D45',e:'manananggal',boss:'Reyna Manananggal',ab:'screech',abTxt:'screeches and hurts the whole tropa',moon:1},
  {n:'Palengke sa Hatinggabi',sky:['#3A2E1E','#17110A'],gr:'#5A4A3A',e:'sigbin',boss:'Sigbin Alpha',ab:'frenzy',abTxt:'attacks twice as fast'},
  {n:'Ilog Pasig',sky:['#1E3A44','#0A1A20'],gr:'#2A4A52',e:'siyokoy',boss:'Hari ng Siyokoy',ab:'wave',abTxt:'sends tidal waves that stun the tropa'},
  {n:'Bundok Banahaw',sky:['#2A3A2A','#0E180E'],gr:'#3A4A2E',e:'kapre',boss:'Higanteng Kapre',ab:'cleave',abTxt:'smashes your first two fighters at once'},
  {n:'Sementeryo sa Undas',sky:['#2E2A3A','#100E18'],gr:'#4A4652',e:'tiyanak',boss:'Reyna Tiyanak',ab:'enrage',abTxt:'gets angry and calls her brood when hurt',moon:1},
  {n:'Langit ng Bakunawa',sky:['#2A1A4A','#08051A'],gr:'#2E2448',e:'bakunawa',boss:'Bakunawa',ab:'eclipse',abTxt:'swallows the moon, blasting everyone and healing itself',moon:1,stars:1}
];
const BAG_MAX=30, FORGE_ORE=6, KEY='bantayBarangay.v1';

/* ---------- save ---------- */
const fresh=()=>({gold:0,ore:0,stage:1,best:1,wave:0,farming:false,forge:1,heroes:[{cls:'knight',lvl:1,gear:{},on:true}],bag:[],nid:1,last:Date.now(),sel:0,speed:1,life:{},ach:{}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
S=Object.assign(fresh(),S);
if(!S.heroes.some(h=>'on' in h))S.heroes.forEach((h,i)=>h.on=i<4);
fixPositions();
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function fmt(n){n=Math.floor(n);if(n<10000)return n.toLocaleString();const u=['K','M','B','T'];let i=-1;while(n>=1000&&i<3){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]}
const zoneOf=s=>ZONES[Math.floor((s-1)/10)%ZONES.length];
const isBoss=s=>s%5===0;
function stats(h){const b=CLS[h.cls],m=(1+0.2*(h.lvl-1))*EVO_M[h.ev||0];let atk=b.atk*m,hp=b.hp*m;for(const s of SLOTS){const g=h.gear[s];if(g){atk+=g.atk||0;hp+=g.hp||0}}const kp=S.heroes.find(x=>x.on&&x.cls==='kapitan'),au=h.on&&kp?1.15+0.05*(kp.ev||0):1;const md=1+0.02*medals();return{atk:Math.round(atk*au*md),hp:Math.round(hp*au*md)}}
const score=it=>it?(it.atk||0)*4+(it.hp||0)/2:0;
const evoCost=h=>({p:Math.round(lvlCost(h)*25),o:[25,150][h.ev||0]});
const lvlCost=h=>Math.round(8*Math.pow(1.17,h.lvl-1)*(1+Math.min(6,ORDER.indexOf(h.cls))*0.25));
const forgeCost=()=>Math.round(300*Math.pow(2.4,S.forge-1));
const goldPerKill=s=>3*Math.pow(1.12,s-1);
function makeItem(slot,r,il){if(r===3)S.life.epic=(S.life.epic||0)+1;const p=(1+il*0.09)*RAR[r].m;const it={id:S.nid++,slot,r,il};

const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

  const rnd=()=>{h=(h+0x6D2B79F5)|0;let t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296};
  const ty=Object.keys(QPOOL);for(let i=ty.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ty[i],ty[j]]=[ty[j],ty[i]]}
  S.q={day:k,bonus:false,list:ty.slice(0,5).map(t=>({t,g:QPOOL[t].g(),pr:0,c:false,p:Math.round(goldPerKill(S.best)*QPOOL[t].pm),o:QPOOL[t].o}))}}

function step(dt){

  if(respawnT>0){respawnT-=dt;if(respawnT<=0){party.forEach(u=>u.hp=u.max);spawnWave()}decay(dt);return}
  const alive=party.filter(u=>u.hp>0);
  const front=()=>{let b=null;for(const f of foes)if(f.hp>0&&f.arrived&&!(f.vanT>0)&&(!b||f.x<b.x))b=f;return b};
  if(hasteT>0)hasteT-=dt;
  for(const u of alive){const c=CLS[u.h.cls];if(c.sp==='regen'&&u.hp<u.max)u.hp=Math.min(u.max,u.hp+u.max*(0.03+0.01*(u.h.ev||0))*dt);u.t-=dt*(hasteT>0?hasteM:1);if(u.t>0)continue;
    if(c.sp==='haste'&&front()){hasteT=4;hasteM=1.4+0.15*(u.h.ev||0);u.t=c.cd;u.lunge=0.6;fx.push({type:'notes',e:u,t:0,d:1});floatE(u,GY-85*SC,'Kanta!','#8FD3FF');hit(front(),u.atk);continue}
    if(c.sp==='mark'&&front()){foes.forEach(f=>{if(f.hp>0){f.markT=4;f.markM=1.3+0.1*(u.h.ev||0)}});u.t=c.cd;u.lunge=0.6;fx.push({type:'chismis',t:0,d:1.2});floatE(u,GY-85*SC,'Chismis!','#F49AD8');continue}
    if(c.heal){const hurt=alive.slice().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];
      if(hurt&&hurt.hp/hurt.max<0.85){const amt=Math.round(u.atk*(2.5+0.5*(u.h.ev||0)));hurt.hp=Math.min(hurt.max,hurt.hp+amt);floatE(hurt,GY-75*SC,'+'+fmt(amt),'#6EE39A');fx.push({type:'heal',e:hurt,t:0,d:0.5});u.t=c.cd;u.lunge=0.6;continue}}
    const tgt=front();if(!tgt){u.t=0.15;continue}
    u.t=c.cd;u.lunge=1;
    if(c.aoe){fx.push({type:'nova',t:0});foes.filter(f=>f.hp>0&&f.arrived&&!(f.vanT>0)).forEach(f=>hit(f,u.atk))}
    else{const k=u.h.cls;if(k==='archer')fx.push({type:'arrow',a:u,b:tgt,t:0});
      else if(k==='tindera'||k==='balut')fx.push({type:'toss',a:u,b:tgt,t:0,c:k==='balut'?'#EFE6D2':['#FF5C8A','#FFD15C','#5CC8FF'][Math.floor(Math.random()*3)]});
      else if(c.sp==='stun'){spawnJeep(u.x,tgt.x,tgt.z,0.5);tgt.t+=1.2+0.4*(u.h.ev||0);floatE(tgt,GY-85*SC,'Stun!','#FFD15C')}
      else fx.push({type:'slash',b:tgt,t:0});
      if(k==='balut'&&Math.random()<0.3)floatE(u,GY-85*SC,'Baluuut!','#EFE6D2');
      hit(tgt,u.atk,c.sp==='crit'?0.35+0.075*(u.h.ev||0):0.1,c.sp==='crit'?2.5:2)}}
  for(const f of foes){if(f.hp<=0||!f.arrived)continue;f.t-=dt;if(f.t>0)continue;f.t=f.boss?(f.ab==='frenzy'?0.7:1.4):1.3;f.lunge=1;

  eclipseT=Math.max(0,eclipseT-dt);shieldT=Math.max(0,shieldT-dt);atkT=Math.max(0,atkT-dt);pisoT=Math.max(0,pisoT-dt);if(banner)banner.t+=dt;fx.forEach(e=>e.t+=dt);fx=fx.filter(e=>e.t<(e.d||0.35));texts.forEach(t=>t.t+=dt);texts=texts.filter(t=>t.t<0.9)}

  for(let r=0;r<3;r++)for(const c of [2,1,0]){const o=cellOwner(c,r),x=o>=0?S.heroes[o]:null;
    h+=`<button class="cell ${x?'full':''} ${o>=0&&o===pickI?'pick':''}" data-act="cell" data-c="${c}" data-r="${r}" aria-label="${CN[c]} column, lane ${r+1}${x?': '+nameOf(x):', empty'}">${x?`<span class="cic2">${CLS[x.cls].ic}</span><span class="cn">${nameOf(x)}</span><small>Lv ${x.lvl}${x.ev?' '+'★'.repeat(x.ev):''}</small>`:'<span class="plus">+</span>'}</button>`}
  h+=`</div>${pickI!==null&&S.heroes[pickI]&&!S.heroes[pickI].on?`<p class="lineup" style="margin:8px 0 0">Placing <b>${nameOf(S.heroes[pickI])}</b>: tap a cell to swap them in.</p>`:''}</div>`;S.heroes.forEach((x,i)=>{const c=CLS[x.cls],s=stats(x);
  h+=`<div class="hero ${S.sel===i?'sel':''}" data-act="sel" data-i="${i}"><div class="badge" style="--c:${c.color};${x.ev?'box-shadow:0 0 0 3px '+(x.ev>1?'#F2B93D':'#B9C9E8'):''}">${c.ic}</div>
  <div><div class="hname">${nameOf(x)}${x.ev?'<span class="star">'+'★'.repeat(x.ev)+'</span>':''}<small>Lv ${x.lvl}</small><button class="tog ${x.on?'on':''}" data-act="deploy" data-i="${i}">${x.on?'Nasa laban':'Naka-bench'}</button></div><div class="hstats">⚔️ ${fmt(s.atk)}  ❤️ ${fmt(s.hp)}</div><div class="hdesc">${c.desc}</div>${(x.ev||0)<2?`<div class="evonext">Evolves into ${EVO[x.cls][x.ev||0]} at Lv ${EVO_LV[x.ev||0]}</div>`:'<div class="evonext">Max evolution</div>'}
  <div class="slots">${SLOTS.map(sl=>{const g=x.gear[sl];return `<button class="slot ${g?'full':''}" style="--rc:${g?RAR[g.r].c:'transparent'}" data-act="unequip" data-i="${i}" data-slot="${sl}" title="${g?RAR[g.r].n+' '+SLOTN[sl]+' (tap to unequip)':'Empty '+SLOTN[sl].toLowerCase()+' slot'}" aria-label="${g?'Unequip '+RAR[g.r].n+' '+SLOTN[sl]:'Empty '+SLOTN[sl]+' slot'}">${g?SLOTI[sl]:''}</button>`}).join('')}</div></div>
  <div class="acts">${costBtn('lvl','Level up',lvlCost(x),'gold',`data-i="${i}"`)}${(x.ev||0)<2&&x.lvl>=EVO_LV[x.ev||0]?(()=>{const ec=evoCost(x);return `<button class="btn evo" data-act="evolve" data-i="${i}" data-cost="${ec.p}" data-cur="gold" data-ore="${ec.o}">Evolve<small>₱ ${fmt(ec.p)}  🍾 ${fmt(ec.o)}</small></button>`})():''}</div></div>`});
  const left=ORDER.filter(k=>!S.heroes.some(x=>x.cls===k));if(left.length)h+='<p class="lineup" style="margin-top:14px"><b>Recruit more tropa</b></p>';left.slice(0,3).forEach(k=>{const c=CLS[k];h+=`<div class="recruit"><div><div class="hname">${c.ic} ${c.name}</div><p>${c.desc}</p></div>${costBtn('recruit','Recruit',c.cost,'gold',`data-cls="${k}"`)}</div>`});
  if(left.length>3)h+=`<p class="lineup">${left.length-3} more tropa unlock as you recruit.</p>`;h+='<p class="lineup" style="margin-top:16px"><b>Tropa combos</b>. Put these members in the lineup together to unlock a special. Evolved members make it stronger.</p>';
  COMBOS.forEach(c=>{const rec=c.m.every(k=>S.heroes.some(x=>x.cls===k)),on=c.m.every(k=>S.heroes.some(x=>x.cls===k&&x.on));
    h+=`<div class="combocard ${on?'on':''}"><div class="cic">${c.m.map(k=>CLS[k].ic).join('')}</div><div><div class="hname">${c.n}<span class="tag">${on?'Active':rec?'Put in lineup':'Locked'}</span></div><div class="hdesc">${c.m.map(k=>CLS[k].name).join(' + ')}. ${c.d}</div></div></div>`});
  $('#p-team').innerHTML=h;updateAfford()}
function mergeable(){const g={};S.bag.forEach(it=>{if(it.r<3){const k=it.slot+it.r;g[k]=(g[k]||0)+1}});return Object.values(g).reduce((a,n)=>a+Math.floor(n/3),0)}
function renderForge(){const o=oddsFor(S.forge-1),max=S.forge>=10,m=mergeable();
  $('#p-forge').innerHTML=`<div class="card"><h2>Ukay-ukay stall level ${S.forge}</h2><p>Trade bote to dig through the bins for random gear, scaled to your best stage (${S.best}). A bigger stall means better finds.</p>
  <div class="odds">${RAR.map((r,i)=>`<span style="--rc:${r.c}">${r.n} ${(o[i]*100).toFixed(1)}%</span>`).join('')}</div>
  <div class="row">${costBtn('forge','Dig for gear',FORGE_ORE,'ore')}${max?'<button class="btn" disabled>Stall maxed</button>':costBtn('upforge','Upgrade stall',forgeCost(),'gold')}</div></div>
  <div class="card"><h2>Palit-tatlo</h2><p>Trade three items of the same grade and slot for one of the next grade. The new item keeps the highest level of the three.</p>
  <button class="btn ${m?'':'ghost'}" data-act="merge" ${m?'':'disabled'}>${m?'Trade '+m+' set'+(m>1?'s':''):'Nothing to trade yet'}</button></div>`;updateAfford()}
function renderBag(){const sel=S.heroes[S.sel],items=S.bag.slice().sort((a,b)=>b.r-a.r||b.il-a.il);
  let h=`<div class="baghead"><p>Equipping to <b>${nameOf(sel)}</b>. Tap a hero in Tropa to switch.</p>${S.bag.length?'<button class="btn ghost" data-act="salvageAll">Sell Divisoria</button>':''}</div>`;
  if(!items.length)h+='<div class="empty">Walang laman ang bayong. Enemies drop gear now and then, and bosses always do. You can also dig at the ukay-ukay.</div>';
  else{h+='<div class="grid">';items.forEach(it=>{const d=Math.round(score(it)-score(sel.gear[it.slot]));
    h+=`<div class="item" style="--rc:${RAR[it.r].c}"><b>${SLOTI[it.slot]} ${itemName(it)}</b><div class="meta" style="color:${RAR[it.r].c};font-weight:800">${RAR[it.r].n}</div><div class="meta">Lv ${it.il}${it.atk?'  ⚔️ '+fmt(it.atk):''}${it.hp?'  ❤️ '+fmt(it.hp):''}</div>
    <div class="delta ${d>=0?'up':'down'}">${d>=0?'+':''}${fmt(Math.abs(d))===fmt(d)?fmt(d):'-'+fmt(-d)} power</div>
    <div class="row"><button class="btn" data-act="equip" data-id="${it.id}">Equip</button><button class="btn ghost" data-act="salvage" data-id="${it.id}">Sell</button></div></div>`});h+='</div>'}
  $('#p-bag').innerHTML=h}
function renderBagCount(){$('#bagCount').textContent=S.bag.length?'('+S.bag.length+')':''}
function renderQuests(){checkDay();const Q=S.q,done=Q.list.filter(q=>q.c).length,all=done===Q.list.length;
  let h=`<div class="card"><h2>Daily gawain</h2><p>Finish these for piso and bote. New gawain in <b id="qreset">${untilReset()}</b>.</p>`;
  Q.list.forEach((q,i)=>{const d=QPOOL[q.t],ready=q.pr>=q.g&&!q.c;
    h+=`<div class="quest ${q.c?'done':''}"><div class="qic">${d.ic}</div><div class="qbody"><b>${d.t(q.g)}</b><div class="qbar"><i id="qb${i}" style="width:${q.pr/q.g*100}%"></i></div><div class="qmeta"><span id="qt${i}">${qProg(q)}</span><span>₱${fmt(q.p)}${q.o?'  🍾 '+q.o:''}</span></div></div>${q.c?'<span class="qok" aria-label="Claimed">✓</span>':`<button class="btn" data-act="qclaim" data-i="${i}" ${ready?'':'disabled'}>Claim</button>`}</div>`});
  h+=`</div><div class="card"><h2>🎁 Pasalubong box</h2><p>Claim all 5 gawain to open it: 40 bote plus a guaranteed Imported or Balikbayan box item.</p>
  <button class="btn evo" data-act="qbonus" ${all&&!Q.bonus?'':'disabled'}>${Q.bonus?'Nabuksan na today':all?'Buksan':done+'/5 claimed'}</button></div>`;
  const md=medals();h+=`<div class="card"><h2>🏅 Mga Tagumpay</h2><p>Long-term goals. Each one you claim earns a medal, and every medal makes the whole tropa +2% stronger in atk and hp, for good. Medals: <b>${md}</b> (tropa +${md*2}%).</p>`;
  ACH.forEach((A,i)=>{const t=achTier(A),n=A.tiers.length,done=t>=n,g=A.tiers[Math.min(t,n-1)],v=A.v(),rw=achReward(A,t);
    h+=`<div class="quest ${done?'done':''}"><div class="qic">${A.ic}</div><div class="qbody"><b>${A.t(g)}</b><div class="qbar"><i id="ab${i}" style="width:${Math.min(100,v/g*100)}%"></i></div><div class="qmeta"><span id="at${i}">${fmt(Math.min(v,g))} / ${fmt(g)}</span><span>${done?'Kumpleto':'Tier '+(t+1)+'/'+n+'  🍾 '+rw.o}</span></div></div>${done?'<span class="qok" aria-label="Complete">🏅</span>':`<button class="btn" data-act="aclaim" data-i="${i}" ${v>=g?'':'disabled'}>Claim</button>`}</div>`});
  h+='</div>';
  $('#p-quest').innerHTML=h}
function tickQuests(){checkDay();const Q=S.q;$('#qdot').hidden=!(Q.list.some(q=>q.pr>=q.g&&!q.c)||(Q.list.every(q=>q.c)&&!Q.bonus)||ACH.some(achReady));
  const rk=ACH.map(x=>achReady(x)?1:0).join(''),cnt=k=>(k.match(/1/g)||[]).length;
  if(tickQuests.rk!==undefined&&rk!==tickQuests.rk){if(cnt(rk)>cnt(tickQuests.rk))toast('🏅 May bagong tagumpay! Claim it in Gawain');tickQuests.rk=rk;if(activeTab==='quest'){renderQuests();return}}tickQuests.rk=rk;
  if(activeTab!=='quest')return;Q.list.forEach((q,i)=>{const b=$('#qb'+i),t=$('#qt'+i);if(b)b.style.width=(q.pr/q.g*100)+'%';if(t)t.textContent=qProg(q)});ACH.forEach((A,i)=>{const t=Math.min(achTier(A),A.tiers.length-1),g=A.tiers[t],v=A.v(),b=$('#ab'+i),x=$('#at'+i);if(b)b.style.width=Math.min(100,v/g*100)+'%';if(x)x.textContent=fmt(Math.min(v,g))+' / '+fmt(g)});const r=$('#qreset');if(r)r.textContent=untilReset()}
function renderAll(){renderTeam();renderForge();renderBag();renderBagCount();renderQuests()}
function updateAfford(){document.querySelectorAll('[data-cost]').forEach(b=>{b.disabled=S[b.dataset.cur]<+b.dataset.cost||(b.dataset.ore!==undefined&&S.ore<+b.dataset.ore)})}
function renderHUD(){$('#gold').textContent=fmt(S.gold);$('#ore').textContent=fmt(S.ore);$('#stageLbl').textContent=(isBoss(S.stage)?'Boss stage ':'Stage ')+S.stage;
  const lp=Math.floor((S.stage-1)/100);$('#zoneLbl').textContent=zoneOf(S.stage).n+(lp?' (Ikot '+(lp+1)+')':'')+(S.farming?', nagfa-farm':'');
  $('#dots').innerHTML=isBoss(S.stage)?'':[0,1,2].map(i=>`<i class="${i<=S.wave?'on':''}"></i>`).join('');
  $('#challenge').hidden=!S.farming;{const ac=activeCombos();$('#comboName').textContent=ac.length?'⚡ '+ac[comboI%ac.length].n:'⚡ No combo in lineup';$('#cfill').style.width=comboM+'%';$('#comboBtn').hidden=!comboArm}tickQuests();$('#speed').textContent=S.speed+'×';updateAfford()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');const tab=e.target.closest('[data-tab]');
  if(tab){activeTab=tab.dataset.tab;document.querySelectorAll('[data-tab]').forEach(t=>t.setAttribute('aria-selected',t===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+activeTab));renderAll();return}
  if(!b)return;const a=b.dataset.act;
  if(a==='lvl'){e.stopPropagation();const x=S.heroes[+b.dataset.i],c=lvlCost(x);if(S.gold<c)return;S.gold-=c;x.lvl++;track('lvl',1);refreshParty();renderTeam();if((x.ev||0)<2&&x.lvl===EVO_LV[x.ev||0])toast(nameOf(x)+' is ready to evolve!')}
  else if(a==='evolve'){e.stopPropagation();const x=S.heroes[+b.dataset.i],ev=x.ev||0,c=evoCost(x);if(ev>=2||x.lvl<EVO_LV[ev]||S.gold<c.p||S.ore<c.o)return;
    const old=nameOf(x);S.gold-=c.p;S.ore-=c.o;x.ev=ev+1;refreshParty();const u=party.find(u=>u.h===x);if(u){u.hp=u.max;fx.push({type:'evo',e:u,t:0,d:1.4})}
    showModal('Nag-evolve!',`${old} is now ${nameOf(x)}! Stats up 50% and a stronger ability.`,'Astig!');renderAll()}
  else if(a==='unequip'){e.stopPropagation();const x=S.heroes[+b.dataset.i],g=x.gear[b.dataset.slot];if(!g){S.sel=+b.dataset.i;activeTab='bag';document.querySelector('[data-tab=bag]').click();return}if(S.bag.length>=BAG_MAX){toast('Puno na ang bayong. Sell something first.');return}S.bag.push(g);delete x.gear[b.dataset.slot];refreshParty();renderAll()}
  else if(a==='aclaim'){const A=ACH[+b.dataset.i],t=achTier(A);if(t>=A.tiers.length||A.v()<A.tiers[t])return;const rw=achReward(A,t);S.ach[A.k]=t+1;S.gold+=rw.p;S.ore+=rw.o;refreshParty();
    showModal('🏅 Bagong medalya!',`${A.t(A.tiers[t])}: done! You got ₱${fmt(rw.p)} and ${rw.o} bote, and the whole tropa is now +${medals()*2}% stronger.`,'Astig!');renderAll()}
  else if(a==='qclaim'){const q=S.q.list[+b.dataset.i];if(!q||q.c||q.pr<q.g)return;q.c=true;S.life.quests=(S.life.quests||0)+1;S.gold+=q.p;S.ore+=q.o;toast('Nakuha: ₱'+fmt(q.p)+(q.o?' + '+q.o+' bote':''));renderQuests()}
  else if(a==='qbonus'){if(S.q.bonus||!S.q.list.every(q=>q.c))return;S.q.bonus=true;S.ore+=40;const it=makeItem(SLOTS[Math.floor(Math.random()*3)],Math.random()<0.25?3:2,S.best);if(S.bag.length<BAG_MAX)S.bag.push(it);else S.ore+=(it.r+1)*2;
    showModal('Pasalubong box!',`Laman: 40 bote and a ${RAR[it.r].n} ${itemName(it)}.`,'Salamat!');renderQuests();renderBagCount()}
  else if(a==='deploy'){e.stopPropagation();const i=+b.dataset.i,x=S.heroes[i],n=S.heroes.filter(h=>h.on).length;
    if(x.on){if(n<=1){toast('Kailangan ng at least isang lalaban!');return}x.on=false;x.pos=null;pickI=null}
    else if(n>=4){pickI=i;toast('Puno na ang 4. Tap a fighter on the grid to swap in '+nameOf(x));renderTeam();return}
    else{x.on=true;x.pos=freeCell(CLS[x.cls].row)}
    buildParty();renderTeam()}
  else if(a==='cell'){const c=+b.dataset.c,r=+b.dataset.r,o=cellOwner(c,r);
    if(pickI===null){if(o>=0){pickI=o;toast('Tap another cell to move '+nameOf(S.heroes[o]))}else toast('Tap a fighter first, or a Naka-bench tag');renderTeam();return}
    const x=S.heroes[pickI];if(o===pickI){pickI=null;renderTeam();return}
    if(x.on){if(o>=0)S.heroes[o].pos=x.pos;x.pos=[c,r]}
    else{if(o>=0){S.heroes[o].on=false;S.heroes[o].pos=null}else if(S.heroes.filter(h=>h.on).length>=4){toast('Puno na ang 4. Tap an occupied cell to swap.');return}x.on=true;x.pos=[c,r]}
    pickI=null;buildParty();renderTeam()}
  else if(a==='sel'){S.sel=+b.dataset.i;renderTeam()}
  else if(a==='recruit'){const k=b.dataset.cls,c=CLS[k].cost;if(S.gold<c)return;S.gold-=c;S.heroes.push({cls:k,lvl:1,gear:{},on:S.heroes.filter(h=>h.on).length<4});fixPositions();buildParty();toast(CLS[k].name+' joined the tropa!');renderTeam()}
  else if(a==='forge'){if(S.ore<FORGE_ORE)return;if(S.bag.length>=BAG_MAX){toast('Puno na ang bayong. Sell something first.');return}S.ore-=FORGE_ORE;track('dig',1);const it=makeItem(SLOTS[Math.floor(Math.random()*3)],rollR(S.forge-1),S.best);S.bag.push(it);toast('Score! '+RAR[it.r].n+' '+itemName(it));renderForge();renderBagCount()}
  else if(a==='upforge'){const c=forgeCost();if(S.gold<c)return;S.gold-=c;S.forge++;renderForge()}
  else if(a==='merge'){let made=0;for(const sl of SLOTS)for(let r=0;r<3;r++){let grp=S.bag.filter(it=>it.slot===sl&&it.r===r).sort((x,y)=>x.il-y.il);while(grp.length>=3){const three=grp.splice(0,3);S.bag=S.bag.filter(it=>!three.includes(it));S.bag.push(makeItem(sl,r+1,Math.max(...three.map(t=>t.il))));made++}}if(made)track('merge',made);toast('Palit-tatlo done: '+made+' upgraded item'+(made>1?'s':''));renderAll()}
  else if(a==='equip'){const it=S.bag.find(i=>i.id===+b.dataset.id),x=S.heroes[S.sel];if(!it)return;const old=x.gear[it.slot];x.gear[it.slot]=it;S.bag=S.bag.filter(i=>i!==it);if(old)S.bag.push(old);refreshParty();renderAll()}
  else if(a==='salvage'){const it=S.bag.find(i=>i.id===+b.dataset.id);if(!it)return;S.ore+=(it.r+1)*2;S.bag=S.bag.filter(i=>i!==it);track('sell',1);renderBag();renderBagCount()}
  else if(a==='salvageAll'){const r=S.bag.filter(i=>i.r===0);S.ore+=r.length*2;track('sell',r.length);S.bag=S.bag.filter(i=>i.r>0);toast(r.length?'Sold '+r.length+' Divisoria items for bote':'No Divisoria items to sell');renderBag();renderBagCount()}
  save();renderHUD()});
$('#comboBtn').onclick=()=>{if(comboArm)fireCombo()};
$('#speed').onclick=()=>{S.speed=S.speed===1?2:S.speed===2?3:1;renderHUD()};
$('#challenge').onclick=()=>{S.farming=false;toast('Laban! Pushing forward after this wave');renderHUD()};
$('#reset').onclick=()=>{if(confirm('Start over? This erases your progress.')){S=fresh();fixPositions();buildParty();S.wave=0;spawnWave();save();renderAll();renderHUD()}};
function showModal(t,txt,btn){$('#mTitle').textContent=t;$('#mText').textContent=txt;$('#mOk').textContent=btn||'Collect';$('#modal').classList.add('show')}
$('#mOk').onclick=()=>$('#modal').classList.remove('show');

/* ---------- offline earnings ---------- */
const away=Math.min(8*3600,(Date.now()-S.last)/1000);
if(away>60&&S.stage>1){const g=Math.round(away*goldPerKill(S.stage)*0.6*0.5),o=Math.floor(away*0.6*0.35*0.5*(1+Math.floor(S.stage/8))*0.3);S.gold+=g;S.ore+=o;
  const hrs=away>=3600?Math.floor(away/3600)+'h '+Math.floor(away%3600/60)+'m':Math.floor(away/60)+'m';
  $('#mTitle').textContent='Welcome back, Bantay!';$('#mText').textContent=`Your tropa kept guarding the barangay for ${hrs} and brought home ₱${fmt(g)} and ${fmt(o)} bote.`;$('#modal').classList.add('show')}

/* ---------- loop ---------- */
checkDay();resize();buildParty();spawnWave();renderAll();renderHUD();
let lastT=performance.now(),hudT=0;
function loop(now){let dt=Math.min(0.1,(now-lastT)/1000);lastT=now;for(let i=0;i<S.speed;i++)step(dt);draw(dt*S.speed);hudT+=dt;if(!document.hidden)track('time',dt);if(hudT>0.25){hudT=0;renderHUD()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else lastT=performance.now()});
</script>
</body>
</html>
