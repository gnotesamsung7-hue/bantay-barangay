name: Build Bantay Barangay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#121B1F' --splashBackgroundColor '#121B1F'

      - name: Lock to portrait
        run: sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: BantayBarangay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
